<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christopher Hanso | MLRO & Financial Crime Executive</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    letterSpacing: {
                        tightest: '-0.08em', /* Forces letters to overlap beautifully */
                        tighter: '-0.04em',
                        widest: '0.3em',
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --mouse-x: 0px;
            --mouse-y: 0px;
        }

        body {
            background-color: #010101; /* Pitch black */
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        /* -------------------------------------------
           1. GLASS BLACK BACKGROUND & LIGHT SPECS
           ------------------------------------------- */
        .glass-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #0a0a0f 0%, #010101 100%);
            z-index: 1;
        }

        /* Animated Specs of Light */
        .light-spec {
            position: absolute;
            background: rgba(0, 240, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(0, 240, 255, 0.5);
            animation: floatUp infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; scale: 1; }
            80% { opacity: 1; scale: 1; }
            100% { transform: translateY(-20vh) scale(0); opacity: 0; }
        }

        /* -------------------------------------------
           2. FLOATING ASSETS (Globe, $, £)
           ------------------------------------------- */
        .floating-asset {
            position: fixed;
            z-index: 2;
            color: rgba(255, 255, 255, 0.03);
            font-weight: 900;
            user-select: none;
            will-change: transform;
        }

        .asset-dollar {
            font-size: 20rem;
            top: 10%; right: 15%;
            transform: translate(calc(var(--mouse-x) * -2), calc(var(--mouse-y) * -2)) rotate(15deg);
        }

        .asset-pound {
            font-size: 15rem;
            bottom: 15%; left: 5%;
            transform: translate(calc(var(--mouse-x) * 1.5), calc(var(--mouse-y) * 1.5)) rotate(-10deg);
        }

        /* Rotating Wireframe Globe */
        .tracking-globe {
            position: fixed;
            top: 20%; left: 50%;
            width: 600px; height: 600px;
            transform: translate(-50%, 0) translate(calc(var(--mouse-x) * -0.5), calc(var(--mouse-y) * -0.5));
            opacity: 0.15;
            z-index: 2;
            animation: spin 30s linear infinite;
        }
        @keyframes spin { 100% { transform: translate(-50%, 0) translate(calc(var(--mouse-x) * -0.5), calc(var(--mouse-y) * -0.5)) rotate(360deg); } }

        /* -------------------------------------------
           3. FOREGROUND & TYPOGRAPHY
           ------------------------------------------- */
        #content-wrapper {
            position: relative;
            z-index: 10;
        }

        /* Cinematic Photo Glass Mask */
        .photo-glass {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            transform: translate(calc(var(--mouse-x) * 0.8), calc(var(--mouse-y) * 0.8));
            transition: filter 0.3s ease;
        }
        .photo-glass::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 60%, #010101 100%);
        }
        .photo-glass:hover {
            filter: brightness(1.2);
        }

        /* Overlapping Typography Setup */
        .name-group {
            position: relative;
            transform: translate(calc(var(--mouse-x) * 1.2), calc(var(--mouse-y) * 1.2));
        }
        .text-glow {
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
        }

        /* Animations */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.5s; }
        .delay-3 { animation-delay: 0.7s; }
        .delay-4 { animation-delay: 1s; }

        @keyframes revealUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-bounce-slow { animation: bounceSlow 2s infinite ease-in-out; }
        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }
    </style>
</head>
<body>

    <!-- 1. GLASS BLACK BACKGROUND -->
    <div class="glass-bg"></div>

    <!-- 2. LIGHT SPECS (Generated via JS below for randomness) -->
    <div id="light-specs-container"></div>

    <!-- 3. FLOATING BACKGROUND ASSETS -->
    <div class="floating-asset asset-dollar">$</div>
    <div class="floating-asset asset-pound">£</div>
    
    <!-- SVG Tracking Globe -->
    <svg class="tracking-globe" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#00f0ff" stroke-width="0.2"/>
        <ellipse cx="50" cy="50" rx="20" ry="48" fill="none" stroke="#00f0ff" stroke-width="0.2"/>
        <ellipse cx="50" cy="50" rx="48" ry="20" fill="none" stroke="#00f0ff" stroke-width="0.2"/>
        <line x1="50" y1="2" x2="50" y2="98" stroke="#00f0ff" stroke-width="0.2"/>
        <line x1="2" y1="50" x2="98" y2="50" stroke="#00f0ff" stroke-width="0.2"/>
        <!-- Tracking Blip -->
        <circle cx="70" cy="50" r="1.5" fill="#00f0ff">
            <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="35" cy="18" r="1" fill="#00f0ff">
            <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
        </circle>
    </svg>

    <!-- 4. MAIN CONTENT -->
    <div id="content-wrapper">
        
        <!-- SECTION 01 — HERO -->
        <section id="hero" class="relative min-h-screen flex items-center justify-center px-6 sm:px-12 lg:px-24">
            
            <div class="max-w-7xl w-full mx-auto grid lg:grid-cols-12 gap-12 items-center pt-10">
                
                <!-- LEFT: Photo Pop-up -->
                <div class="lg:col-span-4 reveal delay-2">
                    <div class="photo-glass w-full max-w-[320px] mx-auto lg:ml-0 aspect-[4/5]">
                        <img src="WhatsApp%20Image%202026-09-24%20at%2012.12.27%20AM.jpg" alt="Christopher Hanso" class="w-full h-full object-cover grayscale opacity-80 mix-blend-screen" />
                        
                        <!-- Floating Tech Accent on Image -->
                        <div class="absolute top-4 left-4 flex gap-1">
                            <span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-pulse"></span>
                            <span class="text-[8px] font-mono text-cyan-400 uppercase tracking-widest">Target Acquired</span>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: Overlapping Typography & Summary -->
                <div class="lg:col-span-8 name-group">
                    
                    <!-- Eyebrow -->
                    <div class="reveal delay-1 mb-6">
                        <span class="font-sans text-[10px] md:text-xs tracking-widest text-gray-500 uppercase border-l border-cyan-500/50 pl-4">
                            FINANCIAL CRIME • AML • EDD • FCC
                        </span>
                    </div>
                    
                    <!-- Overlapping Headline -->
                    <div class="reveal delay-2 relative mb-6">
                        <!-- 'CHRISTOPHER' sits slightly behind and higher -->
                        <h1 class="font-sans font-light text-5xl md:text-7xl lg:text-[7rem] leading-none tracking-tightest text-gray-400 opacity-60 absolute -top-10 md:-top-16 left-0 z-0 select-none text-glow">
                            CHRISTOPHER
                        </h1>
                        <!-- 'HANSO.' sits in front, bolder, overlapping the top word -->
                        <h1 class="font-sans font-black text-6xl md:text-[8rem] lg:text-[10rem] leading-none tracking-tightest text-white relative z-10 drop-shadow-2xl">
                            HANSO<span class="text-cyan-500">.</span>
                        </h1>
                    </div>
                    
                    <!-- Executive Statement -->
                    <div class="reveal delay-3 max-w-xl mt-6 relative z-20">
                        <p class="font-sans text-lg md:text-xl text-gray-400 font-light leading-relaxed">
                            Building stronger financial crime controls through high-risk intelligence, enhanced due diligence and regulatory thinking.
                        </p>
                    </div>

                </div>
            </div>

            <!-- EXPLORE Indicator (Bottom Center) -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 reveal delay-4 z-30">
                <a href="#about" class="group flex flex-col items-center justify-center cursor-pointer opacity-70 hover:opacity-100 transition-opacity duration-300">
                    <span class="font-sans text-[10px] tracking-widest text-gray-400 uppercase mb-3 transition-colors group-hover:text-cyan-400">
                        Explore
                    </span>
                    <div class="w-[1px] h-12 bg-gray-800 relative overflow-hidden">
                        <div class="w-full h-1/2 bg-cyan-400 absolute top-0 animate-bounce-slow shadow-[0_0_15px_rgba(0,240,255,1)]"></div>
                    </div>
                </a>
            </div>
        </section>

        <!-- Placeholder for Section 2 (Allows scrolling) -->
        <section id="about" class="min-h-screen flex items-center justify-center bg-black/50 z-10 relative">
            <h2 class="text-gray-600 font-sans tracking-widest uppercase text-xs border border-gray-800 px-6 py-3 rounded-full">[ Slide 02: Stats & Details Loading... ]</h2>
        </section>

    </div>

    <!-- Interactive Javascript for Smooth Lerp Parallax & Light Specs -->
    <script>
        // 1. Generate random specs of light
        const lightContainer = document.getElementById('light-specs-container');
        for(let i=0; i<15; i++) {
            let spec = document.createElement('div');
            spec.className = 'light-spec';
            spec.style.width = Math.random() * 3 + 1 + 'px';
            spec.style.height = spec.style.width;
            spec.style.left = Math.random() * 100 + 'vw';
            spec.style.animationDuration = Math.random() * 10 + 10 + 's';
            spec.style.animationDelay = Math.random() * 5 + 's';
            lightContainer.appendChild(spec);
        }

        // 2. Buttery Smooth Cursor Parallax (Lerp)
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        
        document.addEventListener('mousemove', (e) => {
            // Calculate target position relative to center
            targetX = (e.clientX - window.innerWidth / 2) / 30;
            targetY = (e.clientY - window.innerHeight / 2) / 30;
        });

        function animateParallax() {
            // Lerp formula: current += (target - current) * ease
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            
            // Update CSS variables smoothly every frame
            document.documentElement.style.setProperty('--mouse-x', `${currentX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${currentY}px`);
            
            requestAnimationFrame(animateParallax);
        }
        animateParallax();

        // 3. Smooth scroll for Explore button
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
