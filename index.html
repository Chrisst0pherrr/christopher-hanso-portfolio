<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-[#010101]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christopher Hanso | MLRO & Financial Crime Executive</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Premium Typography: Kanit (from the PDF prompt) & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Kanit', 'sans-serif'], // Used for chrome gradients
                    },
                    colors: {
                        dark: '#0C0C0C', // From PDF specs
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --mouse-x: 0px;
            --mouse-y: 0px;
        }

        body {
            background-color: #010101;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            word-break: normal; /* PDF instruction: no mid-word breaks */
        }

        /* -------------------------------------------
           1. CINEMATIC ENVIRONMENT & ASSETS
           ------------------------------------------- */
        .glass-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #0a0a0f 0%, #010101 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Floating Assets ($ and £) */
        .floating-symbol {
            position: fixed;
            z-index: 2;
            color: rgba(255, 255, 255, 0.02);
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            user-select: none;
            pointer-events: none;
            will-change: transform;
        }
        .symbol-dollar {
            font-size: 25rem;
            top: 5%; right: 10%;
            transform: translate(calc(var(--mouse-x) * -2), calc(var(--mouse-y) * -2)) rotate(15deg);
        }
        .symbol-pound {
            font-size: 20rem;
            bottom: 5%; left: 5%;
            transform: translate(calc(var(--mouse-x) * 1.5), calc(var(--mouse-y) * 1.5)) rotate(-10deg);
        }

        /* Rotating Tracking Globe */
        .globe-container {
            position: fixed;
            top: 15%; left: 45%;
            width: 700px; height: 700px;
            opacity: 0.07;
            z-index: 2;
            pointer-events: none;
            transform: translate(calc(var(--mouse-x) * -0.5), calc(var(--mouse-y) * -0.5));
            animation: spinGlobe 40s linear infinite;
        }
        @keyframes spinGlobe { 100% { transform: translate(calc(var(--mouse-x) * -0.5), calc(var(--mouse-y) * -0.5)) rotate(360deg); } }

        /* Chrome/Silver Gradient for Headlines */
        .chrome-text {
            background: linear-gradient(180deg, #ffffff 0%, #646973 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* -------------------------------------------
           2. FOREGROUND & TYPOGRAPHY OVERLAPS
           ------------------------------------------- */
        #content-layer {
            position: relative;
            z-index: 10;
        }

        /* Photo Pop-up in Hero */
        .hero-photo-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            transform: translate(calc(var(--mouse-x) * 0.8), calc(var(--mouse-y) * 0.8));
            transition: filter 0.4s ease;
            opacity: 0;
            animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }
        .hero-photo-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, #010101 100%);
        }

        /* Overlapping Name Logic */
        .overlapping-name-group {
            position: relative;
            transform: translate(calc(var(--mouse-x) * 1.2), calc(var(--mouse-y) * 1.2));
        }
        .name-bg {
            position: absolute;
            top: -40px; left: 0;
            font-size: clamp(4rem, 8vw, 8rem);
            font-weight: 300;
            letter-spacing: -0.04em;
            color: rgba(255, 255, 255, 0.1);
            z-index: 0;
            white-space: nowrap;
        }
        .name-fg {
            position: relative;
            font-size: clamp(5rem, 10vw, 10rem);
            font-weight: 900;
            letter-spacing: -0.06em;
            z-index: 10;
            line-height: 0.8;
            text-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* -------------------------------------------
           3. ANIMATIONS & COMPONENTS
           ------------------------------------------- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* Dark on Dark Cards[cite: 12] */
        .dark-card {
            background: rgba(15, 15, 20, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }
        .dark-card:hover {
            border-color: rgba(0, 240, 255, 0.3);
            transform: translateY(-5px);
        }

        /* Scroll Bar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #010101; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- CINEMATIC BACKGROUND -->

    <!-- MAIN CONTENT -->

    <!-- VANILLA JS ENGINE (Mimics React Component Rendering) -->
    <script>
        // 1. Render Bio
        document.getElementById('bio-text').innerText = portfolioData.profile.bio;

        // 2. Render Stats
        const statsHtml = portfolioData.stats.map(stat => `
            <div class="dark-card p-6 rounded-xl text-center reveal">
                <div class="font-display text-4xl font-bold text-white mb-1 chrome-text">${stat.value}</div>
                <div class="text-[10px] font-sans text-gray-400 uppercase tracking-widest">${stat.label}</div>
            </div>
        `).join('');
        document.getElementById('stats-container').innerHTML = statsHtml;

        // 3. Render Experience (Numbered 01/02/03[cite: 12])
        const expHtml = portfolioData.experience.map(job => `
            <div class="dark-card p-8 rounded-2xl reveal flex flex-col md:flex-row gap-6 items-start">
                <div class="font-display text-3xl font-black text-gray-700">${job.id}</div>
                <div>
                    <div class="text-cyan-400 font-sans text-xs tracking-widest mb-2">${job.period}</div>
                    <h3 class="text-2xl font-bold text-white mb-1">${job.company}</h3>
                    <p class="text-sm text-gray-400 mb-4">${job.role}</p>
                    <p class="text-sm text-gray-300 font-light leading-relaxed">${job.desc}</p>
                </div>
            </div>
        `).join('');
        document.getElementById('exp-container').innerHTML = expHtml;

        // 4. Render Services
        const srvHtml = portfolioData.services.map(srv => `
            <div class="dark-card p-8 rounded-2xl reveal group cursor-pointer border-t-2 ${srv.accent}">
                <h3 class="text-2xl font-bold mb-2">${srv.title}</h3>
                <p class="text-sm text-gray-400 mb-4">${srv.type}</p>
                <div class="overflow-hidden max-h-0 group-hover:max-h-24 transition-all duration-500">
                    <div class="bg-black/50 text-gray-300 text-xs p-3 rounded-lg font-sans uppercase tracking-widest border border-white/5">
                        ${srv.reveal}
                    </div>
                </div>
            </div>
        `).join('');
        document.getElementById('services-container').innerHTML = srvHtml;

        // 5. Scroll Reveal & Parallax Physics
        const reveals = document.querySelectorAll('.reveal');
        
        const revealOnScroll = () => {
            const windowHeight = window.innerHeight;
            reveals.forEach(reveal => {
                const revealTop = reveal.getBoundingClientRect().top;
                if (revealTop < windowHeight - 50) {
                    reveal.classList.add('active');
                }
            });
        };
        window.addEventListener('scroll', revealOnScroll);
        setTimeout(revealOnScroll, 100); // Trigger initial load

        // Smooth Lerp Mouse Tracking
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        document.addEventListener('mousemove', (e) => {
            targetX = (e.clientX - window.innerWidth / 2) / 40;
            targetY = (e.clientY - window.innerHeight / 2) / 40;
        });
        function animateParallax() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            document.documentElement.style.setProperty('--mouse-x', `${currentX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${currentY}px`);
            requestAnimationFrame(animateParallax);
        }
        animateParallax();
    </script>
</body>
</html>
