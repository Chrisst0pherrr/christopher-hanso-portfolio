<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-[#030305]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christopher Hanso | MLRO & Financial Crime Executive</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Premium Typography: Inter (closest free alternative to Neue Haas Grotesk) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: '#030305',
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tightest: '-0.06em',
                        widest: '0.25em',
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --mouse-x: 0px;
            --mouse-y: 0px;
        }

        body {
            background-color: #030305;
            color: #ffffff;
            overflow-x: hidden;
            /* Respect reduced motion */
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                    scroll-behavior: auto !important;
                }
            }
        }

        /* 1. Fine Grain / Noise Texture */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* 2. Thin Animated Grid Lines */
        .grid-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 4rem 4rem;
            background-position: center center;
            z-index: -3;
            transform: translate(calc(var(--mouse-x) * 0.5), calc(var(--mouse-y) * 0.5));
            transition: transform 0.1s ease-out;
        }

        /* 3. Occasional Glowing Horizontal Scan Lines */
        .scan-line {
            position: fixed;
            top: -100px;
            left: 0;
            width: 100vw;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            opacity: 0.4;
            z-index: -1;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { top: -100px; opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { top: 100vh; opacity: 0; }
        }

        /* 4. Cinematic Light Fields (Slow moving radial gradients) */
        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -2;
            opacity: 0.4;
            transform: translate(var(--mouse-x), var(--mouse-y));
            transition: transform 0.2s ease-out;
            animation: drift 20s infinite alternate ease-in-out;
        }

        .light-cyan {
            background: rgba(0, 240, 255, 0.15);
            width: 50vw; height: 50vw;
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .light-violet {
            background: rgba(138, 43, 226, 0.12);
            width: 60vw; height: 60vw;
            bottom: -20%; right: -10%;
            animation-delay: -5s;
        }
        .light-emerald {
            background: rgba(16, 185, 129, 0.08);
            width: 40vw; height: 40vw;
            top: 40%; left: 30%;
            animation-delay: -10s;
        }
        .light-crimson {
            background: rgba(220, 20, 60, 0.05);
            width: 45vw; height: 45vw;
            bottom: 10%; left: -10%;
            animation-delay: -15s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        /* 5. Staggered Cinematic Reveal Animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .reveal-delay-1 { animation-delay: 0.2s; }
        .reveal-delay-2 { animation-delay: 0.5s; }
        .reveal-delay-3 { animation-delay: 0.7s; }
        .reveal-delay-4 { animation-delay: 0.9s; }
        .reveal-delay-5 { animation-delay: 1.2s; }

        @keyframes revealUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Explore Indicator Animation */
        @keyframes subtleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }
        .animate-subtle-bounce {
            animation: subtleBounce 2s ease-in-out infinite;
        }

    </style>
</head>
<body class="antialiased">

    <!-- GLOBAL ENVIRONMENT -->
    <div class="noise-overlay"></div>
    <div class="grid-background"></div>
    <div class="scan-line"></div>
    
    <div class="ambient-light light-cyan"></div>
    <div class="ambient-light light-violet"></div>
    <div class="ambient-light light-emerald"></div>
    <div class="ambient-light light-crimson"></div>

    <!-- ==========================================
         SECTION 01 — HERO
         ========================================== -->
    <section id="hero" class="relative min-h-screen flex flex-col justify-center px-6 sm:px-12 lg:px-24">
        <div class="max-w-7xl w-full mx-auto z-10 pt-20">
            
            <!-- Eyebrow -->
            <div class="reveal reveal-delay-1 mb-8">
                <span class="font-sans text-[10px] md:text-xs tracking-[0.3em] text-gray-400 uppercase border-l-2 border-cyan-500/50 pl-4">
                    FINANCIAL CRIME • AML • EDD • FCC
                </span>
            </div>
            
            <!-- Main Headline -->
            <div class="reveal reveal-delay-2 flex flex-col mb-6">
                <h1 class="font-sans font-light text-5xl md:text-7xl lg:text-[7rem] leading-[0.9] tracking-tight text-gray-200">
                    CHRISTOPHER
                </h1>
                <h1 class="font-sans font-black text-6xl md:text-8xl lg:text-[9rem] leading-[0.8] tracking-tightest text-white mt-2">
                    HANSO<span class="text-cyan-500">.</span>
                </h1>
            </div>
            
            <!-- Subhead -->
            <div class="reveal reveal-delay-3 mb-10">
                <h2 class="font-sans text-sm md:text-lg tracking-[0.15em] text-gray-300 font-medium">
                    AML RISK • FINANCIAL CRIME • EDD • BLOCKCHAIN COMPLIANCE
                </h2>
            </div>
            
            <!-- Executive Statement -->
            <div class="reveal reveal-delay-4 max-w-2xl">
                <p class="font-sans text-lg md:text-2xl text-gray-400 font-light leading-relaxed">
                    Building stronger financial crime controls through high-risk intelligence, enhanced due diligence and regulatory thinking.
                </p>
            </div>

        </div>

        <!-- EXPLORE Indicator -->
        <div class="absolute bottom-12 left-1/2 -translate-x-1/2 reveal reveal-delay-5 z-20">
            <a href="#about" class="group flex flex-col items-center justify-center cursor-pointer opacity-70 hover:opacity-100 transition-opacity duration-300">
                <span class="font-sans text-[10px] tracking-[0.3em] text-gray-400 uppercase mb-4 transition-colors group-hover:text-cyan-400">
                    Explore
                </span>
                <div class="w-[1px] h-12 bg-gray-600/50 relative overflow-hidden">
                    <div class="w-full h-1/2 bg-cyan-400 absolute top-0 animate-subtle-bounce"></div>
                </div>
            </a>
        </div>
    </section>

    <!-- Placeholder for Section 2 (To allow scrolling) -->
    <section id="about" class="min-h-screen flex items-center justify-center">
        <!-- Content for Slide 2 will go here next -->
    </section>

    <!-- Scripts -->
    <script>
        // Smooth scroll for the Explore button
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Subtle Mouse Parallax Effect for Background Elements
        document.addEventListener('mousemove', (e) => {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            
            const x = (e.clientX / window.innerWidth - 0.5) * 30; // Max 15px movement
            const y = (e.clientY / window.innerHeight - 0.5) * 30;
            
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
</body>
</html>
